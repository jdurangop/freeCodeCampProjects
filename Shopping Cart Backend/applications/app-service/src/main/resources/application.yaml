server:
  port: 8080
spring:
  application:
    name: "dream-shops"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
  datasource:
    url: "${db-url}"
    username: "${db-username}"
    password: "${db-password}"
    driver-class-name: "${db-driver}"
  jpa:
    database-platform: "${db-platform}"
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    hibernate:
      ddl-auto: "update"
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
